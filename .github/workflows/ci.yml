name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install the backend
        working-directory: backend
        run: uv sync --locked --python 3.12

      - name: Lint the backend
        working-directory: backend
        run: uv run --locked ruff check

      - name: Type-check the backend
        working-directory: backend
        run: uv run --locked pyright

      - name: Test the backend
        working-directory: backend
        run: uv run --locked pytest

      - name: Install Node dependencies
        run: npm ci

      - name: Test the eval graders
        run: npm run test:graders

      - name: Regenerate the contract
        run: npm run contract

      - name: Fail if the committed contract is stale
        run: git add --intent-to-add contract/ && git diff --exit-code -- contract/

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install the backend
        working-directory: backend
        run: uv sync --locked --python 3.12

      - name: Mutate the guard, limiter and output-guard modules
        working-directory: backend
        run: uv run --locked mutmut run

      - name: Fail if any module scores under 90%
        working-directory: backend
        run: |
          uv run --locked python - <<'PY'
          import json
          import sys
          from pathlib import Path

          from mutmut.stats import status_by_exit_code

          KILLED = {"killed", "timeout", "caught by type check"}
          failed = False
          for meta in sorted(Path("mutants/src").rglob("*.py.meta")):
              statuses = [status_by_exit_code[code] for code in json.loads(meta.read_text())["exit_code_by_key"].values()]
              killed = sum(status in KILLED for status in statuses)
              score = 100 * killed / len(statuses)
              module = meta.relative_to("mutants/src").as_posix().removesuffix(".meta")
              print(f"{module}: {score:.1f}% ({killed}/{len(statuses)} killed)")
              failed |= score < 90
          sys.exit(failed)
          PY

      - name: List the surviving mutants
        if: failure()
        working-directory: backend
        run: uv run --locked mutmut results

  guards:
    name: Guard benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true

      - name: Install the backend
        working-directory: backend
        run: uv sync --locked --python 3.12

      - name: Restore the pinned models and corpora
        uses: actions/cache@v4
        with:
          path: |
            .cache/corpora
            .cache/models
          key: guard-data-${{ hashFiles('backend/bench/manifest.json') }}

      - name: Restore the classifier score cache
        uses: actions/cache@v4
        with:
          path: .cache/bench/scores
          key: guard-scores-${{ hashFiles('backend/src/vitae/guards/calibration.json', 'backend/src/vitae/guards/injection.py', 'backend/src/vitae/text.py') }}

      - name: Fetch and verify every pinned file
        working-directory: backend
        run: uv run --locked python -m bench.fetch

      - name: Injection floors on the dev split (T1)
        working-directory: backend
        run: uv run --locked python -m bench.guards check

      - name: Sentence golden rules (T4)
        working-directory: backend
        run: uv run --locked python -m bench.sentences golden

      - name: Scope refusals on recruiter questions
        working-directory: backend
        run: uv run --locked python -m bench.topics

      - name: Tests that need the real models
        working-directory: backend
        run: uv run --locked pytest tests/test_injection.py tests/test_eval_guard_cases.py tests/test_main.py
