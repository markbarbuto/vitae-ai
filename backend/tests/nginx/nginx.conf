# The reverse proxy as a deployment runs it: real client IP from X-Forwarded-For only when the
# connection comes from the trusted load-balancer range, then X-Real-IP overwritten toward the app.
# __APP__ is replaced by the test with the app's host:port.
worker_processes 1;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    log_format t7 '$remote_addr $realip_remote_addr "$http_x_forwarded_for" $status';
    access_log /dev/stdout t7;

    upstream app {
        server __APP__;
        keepalive 16;
    }

    server {
        listen 80;
        listen [::]:80;

        set_real_ip_from 172.31.250.0/29;
        set_real_ip_from fd00:7a17::/125;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;

        location / {
            proxy_pass http://app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header X-Nginx-Remote-Addr $remote_addr always;
        }
    }
}
