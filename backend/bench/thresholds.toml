# Regression floors for `python -m bench.guards check`, which scores the dev split with the committed
# calibration.json and the cascade it names. They sit just under the dev numbers last measured, so any
# change that lowers recall or raises false positives fails CI. They are not the T1 targets: T1 is
# judged once, on the held-out split, after `freeze`. t1_gate counts every corpus, including those the
# second model trained on; common_ground counts only the corpora neither model trained on.

[injection]
t1_gate_recall_min = 0.936
common_ground_recall_min = 0.980
t1_gate_fpr_max = 0.0012
recruiter_fpr_max = 0.008
