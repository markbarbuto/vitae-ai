# Latency probe. Tests run in this order, one at a time. Every message is a
# different string, so the model server's prompt cache can reuse only the
# shared system prompt, as it can for real visitors. The first two warm the
# server up and are left out of the report.
# The provider runs on backend/.venv: the npm script sets PROMPTFOO_PYTHON through backend/venv.mjs.
description: Vitae latency probe

prompts:
  - "{{message}}"

providers:
  - id: file://provider.py
    label: vitae-api

evaluateOptions:
  maxConcurrency: 1

tests:
  - vars: { message: "Tell me a little about your background" }
    metadata: { group: warmup }
  - vars: { message: "Tell me a little about your background" }
    metadata: { group: warmup }
  - description: experience
    vars: { message: "Tell me about your work experience" }
    metadata: { group: "generated", prompt: experience, expect: "answered" }
  - description: projects
    vars: { message: "What projects have you built?" }
    metadata: { group: "generated", prompt: projects, expect: "answered" }
  - description: stack
    vars: { message: "What's your tech stack?" }
    metadata: { group: "generated", prompt: stack, expect: "answered" }
  - description: accomplishment
    vars: { message: "What's an accomplishment you're proud of at work?" }
    metadata: { group: "generated", prompt: accomplishment, expect: "answered" }
  - description: education
    vars: { message: "Where did you study and what was your education like?" }
    metadata: { group: "generated", prompt: education, expect: "answered" }
  - description: working-style
    vars: { message: "How would you describe your working style and collaboration?" }
    metadata: { group: "generated", prompt: working-style, expect: "answered" }
  - description: availability
    vars: { message: "Are you open to new opportunities?" }
    metadata: { group: "fixed answer", prompt: availability, expect: "availability" }
  - description: unrelated
    vars: { message: "What's the capital of France?" }
    metadata: { group: "fixed answer", prompt: unrelated, expect: "refused:unrelated" }
